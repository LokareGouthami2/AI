# Render Blueprint: one free web service running the single-container image.
# Dashboard → New → Blueprint → pick this repository and this branch.
services:
  - type: web
    name: writeai
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: claude/writeai-2-0-platform-3ch69p
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: WRITEAI_ENV
        value: production
      # Site password: Render asks for it when you create the Blueprint.
      # Anyone without it sees only a login page. Leave empty = public site.
      - key: WRITEAI_API_TOKEN
        sync: false
      # Optional: AI-written notes. Without a key the built-in offline engine
      # is used.
      - key: ANTHROPIC_API_KEY
        sync: false
